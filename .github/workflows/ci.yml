name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every push and PR runs on ubuntu only. The test suite never touches a
# keychain (AGENTS.md), so a macOS runner would exercise nothing more; the
# darwin builds run in the tag-only release workflow, and `make verify` runs
# locally on macOS before each push.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  ATHENA_KEYCHAIN_SERVICE: piekstra.athena.hermetic-tests

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The keyring crate's Linux backend (libdbus-sys) needs the system
      # D-Bus library and pkg-config to build.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: smoke
        run: make smoke

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cargo-audit and cargo-deny read Cargo.lock without compiling the tree.
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2

      - name: cargo-audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: cargo-deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check

      # The gitleaks CLI, not gitleaks-action: the action needs a paid
      # license on an organization's repository. The checksum is pinned
      # here, so a replaced release asset fails the job.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
