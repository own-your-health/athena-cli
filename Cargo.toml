[package]
name = "athena-cli"
description = "Unofficial CLI that downloads a patient's or caregiver's own records from athenahealth practices through athenahealth's patient-access FHIR API."
version = "0.6.1"
edition = "2021"
# pk-cli-auth's refresh lock uses File::try_lock (1.89).
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/own-your-health/athena-cli"
authors = ["piekstra"]
publish = false

[lib]
name = "athena"
path = "src/lib.rs"

[[bin]]
name = "athena"
path = "src/main.rs"

[dependencies]
pk-cli-core = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5", features = ["reqwest"] }
pk-cli-secrets = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
pk-cli-config = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
pk-cli-selfupdate = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
pk-cli-auth = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
pk-cli-http = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
pk-cli-documents = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
# A sign-in window per profile, and its browser profile removed with the
# profile.
pk-cli-browser = { git = "https://github.com/piekstra/cli-common", tag = "v0.37.5" }
# medical-common: the SMART sign-in, the FHIR client, and the
# health-records/v1 stream and DTOs. Same cli-common tag.
pk-med-smart = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.12", features = ["browser"] }
pk-med-fhir = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.12" }
pk-med-records = { git = "https://github.com/own-your-health/medical-common", tag = "v0.6.12" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# preserve_order: DTO fields render in build order (SPEC v1 §1.4).
# raw_value: a resource is written to the stream as the server's own text,
# so no number or key is re-serialized on the way through.
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
# The base64 of Binary resources.
base64 = "0.22"
# A document id too long for a file name is shortened to a prefix and its
# hash; the mock's PKCE check (S256) uses it too.
sha2 = "0.11"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"
